services:
  backend:
    build:
      context: .
    container_name: aether-search-backend
    restart: unless-stopped
    depends_on:
      - searxng
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-http://localhost:8000}
      - OPENROUTER_TITLE=${OPENROUTER_TITLE:-Aether Local Search Agent}
      - SEARXNG_URL=http://searxng:8080
      - SEARCH_TOP_K=${SEARCH_TOP_K:-5}
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-20}
      - REQUEST_RETRIES=${REQUEST_RETRIES:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

  searxng:
    image: searxng/searxng:latest
    container_name: aether-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-change-this-local-secret}
