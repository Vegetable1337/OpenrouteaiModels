use_default_settings: true

general:
  debug: false
  instance_name: "Aether Local Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET_KEY:-change-this-local-secret}"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
